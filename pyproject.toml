[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nbskill"
dynamic = ["version"]
description = "LLM-skill for working with nb"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Konrad", email = "62557233+MorsCerta-crypto@users.noreply.github.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "execnb>=0.2.2",
    "fastaistyle>=0.0.15",
    "fastcore>=1.12.43",
    "fastmcp>=3.3.1",
    "lisette>=0.1.33",
    "nbdev>=3.0.15",
    "safepyrun>=0.1.0",
]

[project.urls]
Repository = "https://github.com/MorsCerta-crypto/nbskill"
Documentation = "https://MorsCerta-crypto.github.io/nbskill/"

[project.scripts]
read_nb = "nbskill.read:read_nb"
write_nb = "nbskill.write:write_nb"
update_cell = "nbskill.write:update_cell"
show_doc = "nbskill.read:show_doc"
exec_nb = "nbskill.execute:exec_nb"
diff_nb = "nbskill.review:diff_nb"
py2nb = "nbskill.convert:py2nb"
py2nbs = "nbskill.convert:py2nbs"
style_check = "nbskill.review:style_check"
install_nbskill = "nbskill.skill:install_nbskill"
build_nbskill_skill = "nbskill.skill:build_skill_from_readme"
symbol_graph = "nbskill.graph:symbol_graph"
private_symbol_report = "nbskill.graph:private_symbol_report"
nbskill_mcp = "nbskill.mcp:main"

[project.entry-points.nbdev]
nbskill = "nbskill._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "nbskill.__version__"}

[tool.setuptools.packages.find]
include = ["nbskill"]

[tool.setuptools.package-data]
nbskill = ["SKILL.md", "SKILL.archive.md", "references/*.md"]

[tool.nbdev]
allowed_cell_metadata_keys = ["nbskill","nbskill_timeout_hash","nbskill_executed_hash","nbskill_timeout_seconds"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
