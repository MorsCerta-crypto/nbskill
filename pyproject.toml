[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nbskill"
dynamic = ["version"]
description = "LLM-skill for working with nb"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Konrad", email = "62557233+MorsCerta-crypto@users.noreply.github.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "botocore>=1.43.42",
    "execnb>=0.2.2",
    "fastaistyle>=0.0.15",
    "fastcore==2.1.*",
    "fastmcp>=3.3.1",
    "lancedb>=0.25.0",
    "lisette>=0.1.33",
    "nbdev>=3.0.15",
    "packaging>=24",
    "remold>=0.1.0",
    "safepyrun>=0.2.3",
    "sentence-transformers>=5.5.1",
]

[project.urls]
Repository = "https://github.com/MorsCerta-crypto/nbskill"
Documentation = "https://MorsCerta-crypto.github.io/nbskill/"

[project.scripts]
nbskill_mcp = "nbskill.mcp:main"
install_nbskill = "nbskill.cli:install_nbskill"
nbskill_mcp_log = "nbskill.cli:nbskill_mcp_log"
nbskill_mcp_log_problems = "nbskill.cli:nbskill_mcp_log_problems"

[project.entry-points.nbdev]
nbskill = "nbskill._modidx:d"

[project.entry-points.pyskills]
"nbskill.skill" = "nbskill.skill"

[tool.setuptools.dynamic]
version = {attr = "nbskill.__version__"}

[tool.setuptools.packages.find]
include = ["nbskill", "nbskill.references"]

[tool.setuptools.package-data]
nbskill = ["AGENTS.md", "SKILL.md", "SKILL.archive.md", "references/*.md"]

[tool.nbdev]
allowed_metadata_keys = ["nbskill"]
jupyter_hooks = true
allowed_cell_metadata_keys = ["nbskill"]

[tool.fastship]
branch = "main"

[dependency-groups]
dev = [
    "fastship>=0.1.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.3",
    "remold>=0.1.0",
]
