[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nbskill"
dynamic = ["version"]
description = "Notebook-aware context, editing, execution, and review for Python agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Konrad", email = "62557233+MorsCerta-crypto@users.noreply.github.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "execnb>=0.2.2",
    "fastaistyle>=0.0.15",
    "fastcore>=2.2.31,<2.3",
    "nbdev>=3.3.25",
    "pyskills>=0.0.33",
    "remold>=0.1.0",
    "safepyrun>=0.2.10",
    "httpx2>=2.13.1",
]

[project.urls]
Repository = "https://github.com/MorsCerta-crypto/nbskill"
Documentation = "https://MorsCerta-crypto.github.io/nbskill/"

[project.scripts]
install_nbskill = "nbskill.nbskill:install_nbskill_cli"

[project.entry-points.nbdev]
nbskill = "nbskill._modidx:d"

[project.entry-points.pyskills]
"nbskill.skill" = "nbskill.skill"

[tool.setuptools.dynamic]
version = {attr = "nbskill.__version__"}

[tool.setuptools.packages.find]
include = ["nbskill", "nbskill.references"]

[tool.setuptools.package-data]
nbskill = ["AGENTS.md", "SKILL.md", "references/*.md"]

[tool.nbdev]
allowed_metadata_keys = ["nbskill"]
jupyter_hooks = true
allowed_cell_metadata_keys = ["nbskill"]

[tool.ease]
deployments = false

[tool.fastship]
branch = "main"

[dependency-groups]
dev = [
    "fastship>=0.1.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "nbdev>=3.3.25",
    "pytest>=9.0.3",
    "remold>=0.1.0",
]

[tool.chkstyle]
# nbdev regenerates this symbol index; its formatting is not maintained by hand.
skip_paths = ["nbskill/_modidx.py"]
