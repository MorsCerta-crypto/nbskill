default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: pytest
        name: Python tests
        entry: uv run --locked pytest -q
        language: system
        pass_filenames: false
        always_run: true
      - id: nbdev-test
        name: Notebook tests
        entry: uv run --locked nbdev-test --n-workers 0 --pause 1
        language: system
        pass_filenames: false
        always_run: true
