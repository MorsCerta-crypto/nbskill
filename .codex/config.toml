[mcp_servers.nbskill]
enabled = true
required = true
command = "/opt/homebrew/bin/uv"
args = ["run", "--project", "/Users/macbook/Projects/nbskill", "nbskill_mcp"]
cwd = "/Users/macbook/Projects/nbskill"
startup_timeout_sec = 60
tool_timeout_sec = 180

[mcp_servers.nbskill.tools.edit_notebook]
approval_mode = "approve"

[mcp_servers.nbskill.tools.context]
approval_mode = "approve"
