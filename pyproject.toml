[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nbskill"
dynamic = ["version"]
description = "Context search, structural review, and nbdev craft for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Konrad", email = "62557233+MorsCerta-crypto@users.noreply.github.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "execnb>=0.2.2",
    "fastaistyle>=0.0.15",
    "fastcore>=2.2.31,<2.3",
    "nbdev>=3.3.25",
    "pyskills>=0.0.33",
]

[project.urls]
Repository = "https://github.com/MorsCerta-crypto/nbskill"
Documentation = "https://MorsCerta-crypto.github.io/nbskill/"

[project.scripts]
install_nbskill = "nbskill.work:install_skill_cli"

[project.entry-points.nbdev]
nbskill = "nbskill._modidx:d"

[project.entry-points.pyskills]
"nbskill.skill" = "nbskill.skill"

[tool.setuptools.dynamic]
version = {attr = "nbskill.__version__"}

[tool.setuptools.packages.find]
include = ["nbskill"]

[tool.setuptools.package-data]
nbskill = ["SKILL.md"]

[tool.nbdev]
allowed_metadata_keys = ["nbskill"]
jupyter_hooks = true
allowed_cell_metadata_keys = ["nbskill"]

[tool.ease]
deployments = false
workflow = "native"

[tool.fastship]
branch = "main"

[dependency-groups]
dev = [
    "fastship>=0.1.10",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "nbdev>=3.3.25",
    "pre-commit>=4.0",
    "pytest>=9.0.3",
]

[tool.chkstyle]
# nbdev regenerates this symbol index; its formatting is not maintained by hand.
skip_paths = ["nbskill/_modidx.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# This revision recognises nbdev exporti cells when analysing import usage.
fastaistyle = { git = "https://github.com/AnswerDotAI/fastaistyle", rev = "1d40ae72569b68d56187e441ac46cceb8f6053ce" }
