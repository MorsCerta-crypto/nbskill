[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nbskill"
dynamic = ["version"]
description = "LLM-skill for working with nb"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Konrad", email = "62557233+MorsCerta-crypto@users.noreply.github.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "botocore>=1.43.42",
    "execnb>=0.2.2",
    "fastaistyle>=0.0.15",
    "fastcore==2.0.*",
    "fastmcp>=3.3.1",
    "lancedb>=0.25.0",
    "lisette>=0.1.33",
    "nbdev>=3.0.15",
    "packaging>=24",
    "remold>=0.1.0",
    "safepyrun>=0.2.3",
    "sentence-transformers>=5.5.1",
]

[project.urls]
Repository = "https://github.com/MorsCerta-crypto/nbskill"
Documentation = "https://MorsCerta-crypto.github.io/nbskill/"

[project.scripts]
context = "nbskill.cli:context"
filter_context = "nbskill.cli:filter_context"
write_nb = "nbskill.cli:write_nb"
update_cell = "nbskill.cli:update_cell"
batch_edit_nb = "nbskill.cli:batch_edit_nb"
split_nb_chapter = "nbskill.cli:split_nb_chapter"
exec_nb = "nbskill.cli:exec_nb"
diff_nb = "nbskill.cli:diff_nb"
convert = "nbskill.cli:convert"
style_check = "nbskill.cli:style_check"
nbskill_validate = "nbskill.cli:nbskill_validate"
install_nbskill = "nbskill.cli:install_nbskill"
build_nbskill_skill = "nbskill.cli:build_nbskill_skill"
symbol_connection = "nbskill.cli:symbol_connection"
reference = "nbskill.cli:reference"
nbskill_mcp = "nbskill.cli:nbskill_mcp"
nbskill_mcp_start = "nbskill.cli:nbskill_mcp_start"
nbskill_mcp_stop = "nbskill.cli:nbskill_mcp_stop"
nbskill_mcp_restart = "nbskill.cli:nbskill_mcp_restart"
nbskill_mcp_log = "nbskill.cli:nbskill_mcp_log"
nbskill_mcp_log_problems = "nbskill.cli:nbskill_mcp_log_problems"
nbskill_status = "nbskill.cli:nbskill_status"
agent_workbench = "nbskill.cli:agent_workbench"

[project.entry-points.nbdev]
nbskill = "nbskill._modidx:d"

[project.entry-points.pyskills]
"nbskill.skill" = "nbskill.skill"

[tool.setuptools.dynamic]
version = {attr = "nbskill.__version__"}

[tool.setuptools.packages.find]
include = ["nbskill"]

[tool.setuptools.package-data]
nbskill = ["AGENTS.md", "SKILL.md", "SKILL.archive.md", "references/*.md"]

[tool.nbdev]
allowed_metadata_keys = ["nbskill"]
jupyter_hooks = true
allowed_cell_metadata_keys = ["nbskill"]

[tool.fastship]
branch = "main"

[dependency-groups]
dev = [
    "fastship>=0.1.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.3",
    "remold>=0.1.0",
]
