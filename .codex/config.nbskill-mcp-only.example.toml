# Example project-local Codex config for testing an nbskill-MCP-first workflow.
#
# To test it, replace `.codex/config.toml` with this file's contents, then
# restart/reconnect Codex so tool schemas are refreshed.
#
# This does not remove Codex built-in tools by itself. It narrows MCP exposure
# to nbskill and uses approvals/sandboxing to make non-MCP changes explicit.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[mcp_servers.nbskill]
enabled = true
command = "uv"
args = ["run", "nbskill_mcp"]

# Keep the agent-facing MCP surface small and notebook-specific.
enabled_tools = [
  "healthcheck",
  "doctor",
  "nb_overview",
  "nb_chapter",
  "nb_cell",
  "show_doc",
  "write_nb",
  "update_cell",
  "batch_edit_nb",
  "exec_nb",
  "diff_nb",
  "style_check",
  "symbol_graph",
  "agent_workbench",
]

# If you have other MCP servers in your user config, disable them here by name.
# Uncomment and adapt these examples if they exist in your setup.
#
# [mcp_servers.github]
# enabled = false
#
# [mcp_servers.context7]
# enabled = false

# If your Codex build supports app connector controls, disable broad apps here.
# Leave commented until you confirm the exact app ids in your environment.
#
# [apps.github]
# enabled = false
# default_tools_enabled = false
# destructive_enabled = false
# open_world_enabled = false
