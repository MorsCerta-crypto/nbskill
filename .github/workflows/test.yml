name: Checks
'on':
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync nbdev-test
      - name: Verify notebook exports
        run: |
          uv run --no-sync nbdev-export
          git diff --exit-code -- nbskill
          test -z "$(git ls-files --others --exclude-standard -- nbskill)"
